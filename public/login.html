<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · CareerLaunch Studio</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(100%,420px);background:#fff;border:1px solid var(--border);border-radius:22px;padding:32px;box-shadow:0 20px 60px #20345a12}.mark{width:44px;height:44px;border-radius:14px;background:#3659d9;color:white;display:grid;place-items:center;font-weight:800;font-size:20px}.muted{color:var(--text-dim);font-size:14px;line-height:1.6}input{width:100%;height:48px;padding:0 14px;border:1px solid var(--border);border-radius:11px;margin:8px 0}button{width:100%;height:48px;border:0;border-radius:11px;background:var(--brand);color:white;font-weight:700;margin-top:10px}.alt{background:#eef2f8;color:#334}.msg{min-height:24px;color:var(--text-dim);font-size:13px}.hidden{display:none!important}</style></head><body><main class="login"><div class="mark">C</div><h1>Welcome to CareerLaunch</h1><p class="muted">Sign in with your email. We’ll send a secure one-time code. No password needed.</p><form id="form"><input id="email" type="email" placeholder="you@example.com" autocomplete="username webauthn" required><input id="code" class="hidden" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"><button id="submit">Continue</button><button id="back" class="alt hidden" type="button">Use another email</button></form><section id="passkey" class="hidden"><p class="muted">Add a passkey for faster sign-in with your fingerprint, face, or screen lock.</p><button id="add">Add a passkey</button><button id="skip" class="alt">Not now</button></section><p id="msg" class="msg" role="status"></p></main><script>(()=>{const A=window.hatchable?.auth,form=document.querySelector('#form'),email=document.querySelector('#email'),code=document.querySelector('#code'),submit=document.querySelector('#submit'),back=document.querySelector('#back'),msg=document.querySelector('#msg'),pass=document.querySelector('#passkey');let step='email',hasPasskey=false;const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';location.replace(n.startsWith('/')&&!n.startsWith('//')&&!n.includes('\\')?n:'/')};const say=t=>msg.textContent=t;if(!A){say('Sign-in is unavailable. Refresh the page.');return}A.getSession().then(s=>{if(s?.user)next()});form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;try{if(step==='email'){const r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{await A.signInWithPasskey({email:email.value.trim()});next();return}catch{}}step='code';code.classList.remove('hidden');back.classList.remove('hidden');submit.textContent='Verify code';say('Check your email for the 6-digit code.');code.focus()}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!hasPasskey&&!localStorage.getItem('passkey_offer_declined')&&A.supportsPasskeys()){form.classList.add('hidden');pass.classList.remove('hidden');say('')}else next()}}catch(err){say(err.message||'Something went wrong.')}finally{submit.disabled=false}});back.onclick=()=>{step='email';code.classList.add('hidden');back.classList.add('hidden');submit.textContent='Continue';say('')};document.querySelector('#add').onclick=async()=>{try{await A.registerPasskey()}catch{}next()};document.querySelector('#skip').onclick=()=>{localStorage.setItem('passkey_offer_declined','1');next()}})();</script></body></html>
